name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.83.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.83.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: |
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy
          cargo test -- --test-threads=1

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect pnpm lockfile
        id: lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.lockfile.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Enable pnpm
        if: steps.lockfile.outputs.present == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.33.3 --activate
      - name: Install
        if: steps.lockfile.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Test
        if: steps.lockfile.outputs.present == 'true'
        run: |
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy
          pnpm test
      - name: Typecheck
        if: steps.lockfile.outputs.present == 'true'
        run: pnpm typecheck
      - name: Build web
        if: steps.lockfile.outputs.present == 'true'
        run: pnpm --filter web build

  # The desktop crate stays out of the workspace. Its Tauri 2.6 graph
  # needs edition2024 (Rust 1.88). rust-toolchain.toml pins 1.83, so these
  # commands select +1.88.0 explicitly. The workspace job above stays on 1.83.
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
      - name: Stub frontend dist
        run: |
          mkdir -p apps/desktop/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > apps/desktop/dist/index.html
      - name: Format
        run: cargo +1.88.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo +1.88.0 clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Check
        run: cargo +1.88.0 check --manifest-path apps/desktop/src-tauri/Cargo.toml
